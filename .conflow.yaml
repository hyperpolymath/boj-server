# conflow pipeline - Nickel generation
version: "1"
name: "boj-server"

stages:
  - name: "generate"
    description: "Generate configuration from Nickel"
    tool:
      type: nickel
      command: export
      file: configs/config.ncl
      format: json
    input: "configs/config.ncl"
    output: generated/config.json

  - name: "validate"
    description: "Validate generated configuration"
    tool:
      type: cue
      command: vet
      schemas:
        - schemas/config.cue
    input:
      from_stage: generate
    depends_on:
      - generate
