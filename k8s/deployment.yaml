apiVersion: apps/v1
kind: Deployment
metadata:
  name: boj-server
  labels:
    app: boj-server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: boj-server
  template:
    metadata:
      labels:
        app: boj-server
    spec:
      containers:
      - name: boj-server
        image: ghcr.io/hyperpolymath/boj-server:latest
        ports:
        - containerPort: 7700
        - containerPort: 7701
        - containerPort: 7702
        - containerPort: 7703
        env:
        - name: BOJ_URL
          value: "http://localhost:7700"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
      restartPolicy: Always
