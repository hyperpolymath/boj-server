# Cloudflare Workers static-asset configuration for boj-server.net.
# Migrated from Pages (pages_build_output_dir) to Workers + Assets format:
# the old key is not recognised by the Workers build system post-Pages merger.
#
# [build] command="" prevents the Git Integration from attempting to install
# .tool-versions entries (Zig, Elixir, Idris2, Deno) before a non-existent
# build step. The site/ directory is deployed as-is with no build phase.
# For the GitHub Actions fallback see .github/workflows/pages-deploy.yml.

name = "boj-server"
compatibility_date = "2026-06-24"

[assets]
directory = "site"

[build]
command = ""

# Serve the site on app.boj-server.net. The apex is left for an outer site that
# will link to this one (owner decision, 2026-10-09). A fresh hostname has no DNS
# record, so the deploy creates one. That matters because, in a non-TTY run such
# as CI, wrangler sets override_existing_dns_record = true without prompting
# (deploy-helpers/src/triggers/publish-routes.ts). Pointed at the apex, it would
# silently replace the existing apex record.
[[routes]]
pattern = "app.boj-server.net"
custom_domain = true
