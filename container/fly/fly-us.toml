#
# BoJ Seed Node — US East (Ashburn VA, iad)
# Deploy: fly deploy --config container/fly/fly-us.toml --dockerfile container/Containerfile.fly  (from repo root)

app            = "boj-seed-us"
primary_region = "iad"

[env]
  APP_HOST            = "0.0.0.0"
  APP_PORT            = "7700"
  APP_DATA_DIR        = "/data"
  APP_LOG_FORMAT      = "json"
  BOJ_QUIC            = "1"
  BOJ_FEDERATION_PORT = "9999"
  BOJ_NODE_ID         = "seed-us-east"
  BOJ_SEED_NODES      = "boj-seed-eu.fly.dev:9999,boj-seed-de.fly.dev:9999,boj-seed-us.fly.dev:9999,boj-seed-ap.fly.dev:9999"
  MIX_ENV             = "prod"
  PORT                = "7700"

[[mounts]]
  source      = "boj_data"
  destination = "/data"

[[services]]
  internal_port = 7700
  protocol      = "tcp"

  [[services.ports]]
    handlers    = ["http"]
    port        = 80
    force_https = true

  [[services.ports]]
    handlers = ["tls", "http"]
    port     = 443

  [[services.tcp_checks]]
    grace_period  = "30s"
    interval      = "30s"
    restart_limit = 0
    timeout       = "10s"

[[services]]
  internal_port = 9999
  protocol      = "udp"

  [[services.ports]]
    port = 9999

[checks]
  [checks.health]
    type     = "http"
    port     = 7700
    method   = "GET"
    path     = "/health"
    interval = "30s"
    timeout  = "10s"
