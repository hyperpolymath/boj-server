# eclexiaiser manifest for boj-server

[project]
name = "boj-server"

[[functions]]
name = "serve"
source = "src/main.rs"
energy-budget-mj = 150.0

[carbon]
provider = "static"
region = "GB"
static-intensity = 200.0

[report]
format = "text"
include-recommendations = true
