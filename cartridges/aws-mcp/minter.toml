name = "aws-mcp"
description = "AWS cloud cartridge — Signature V4 auth, multi-service routing (S3/EC2/Lambda/SQS/DynamoDB) with rate-limit back-pressure"
version = "0.2.0"
domain = "Cloud"
protocols = [
    "MCP",
    "REST",
]
tier = "Ayo"
backend = "universal"
generate_panel = true

[auth]
method = "aws_signature_v4"
credential_source = "vault-mcp"
fields = ["access_key_id", "secret_access_key", "region"]

[services]
s3 = "https://s3.{region}.amazonaws.com"
ec2 = "https://ec2.{region}.amazonaws.com"
lambda = "https://lambda.{region}.amazonaws.com"
sqs = "https://sqs.{region}.amazonaws.com"
dynamodb = "https://dynamodb.{region}.amazonaws.com"
