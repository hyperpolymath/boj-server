# SPDX-License-Identifier: MPL-2.0
# Dependabot v2 configuration for boj-server.
# Scoped strictly to directories that actually hold standalone manifests/lockfiles:
#   - /           -> GitHub Actions (.github/workflows/*.yml) + root JS package.json
#   - /elixir     -> Mix (elixir/mix.exs + elixir/mix.lock)
#   - /coord-tui  -> Cargo (coord-tui/Cargo.toml + coord-tui/Cargo.lock)
# Note: /tray is intentionally omitted because tray/Cargo.toml references the
# external sibling path `../../gossamer/bindings/rust`, which cannot resolve in
# Dependabot's repository-only checkout.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

  - package-ecosystem: "mix"
    directory: "/elixir"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

  - package-ecosystem: "cargo"
    directory: "/coord-tui"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
