# SPDX-License-Identifier: MPL-2.0
# Dependabot configuration for hyperpolymath/boj-server
# Scoped strictly to directories carrying real manifests (docs/DEPENDABOT-POLICY.adoc).

version: 2
updates:
  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 2

  # Root MCP bridge package.json (Bun / Deno / pnpm)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2

  # Elixir REST adapter (elixir/mix.exs)
  - package-ecosystem: "mix"
    directory: "/elixir"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2

  # Rust coordination TUI (coord-tui/Cargo.toml)
  - package-ecosystem: "cargo"
    directory: "/coord-tui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2

  # Rust system tray utility (tray/Cargo.toml)
  - package-ecosystem: "cargo"
    directory: "/tray"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
