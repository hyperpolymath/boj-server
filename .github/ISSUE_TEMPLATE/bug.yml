# SPDX-License-Identifier: MPL-2.0
name: "Bug report"
description: "Report something that is broken or behaving unexpectedly."
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: "What happened?"
      description: "Describe the problem. What did you see?"
    validations:
      required: true
  - type: textarea
    id: repro-steps
    attributes:
      label: "Steps to reproduce"
      description: "Exact steps that trigger the problem, one per line."
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected behaviour"
      description: "What did you expect to happen instead?"
  - type: input
    id: version
    attributes:
      label: "Version"
      placeholder: "e.g. 0.4.7 / commit SHA"
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: "Component"
      description: "Which part of boj-server is affected?"
      options:
        - "MCP bridge"
        - "Elixir REST core"
        - "Cartridges"
        - "ABI / proofs"
        - "Coordination (coord_*)"
        - "Tray / TUI"
        - "CI / workflows"
        - "Other"
  - type: textarea
    id: logs
    attributes:
      label: "Relevant logs / stack trace"
      description: "Paste any logs or stack traces."
      render: shell
  - type: textarea
    id: environment
    attributes:
      label: "Environment"
      description: "OS, runtime (Deno/Node/Bun) and versions, deployment shape (stdio/http/container)"
