# BoJ Server — Zig FFI test & build pipeline

name: Zig FFI Tests

on:
  push:
    branches: [main]
    paths:
      - 'ffi/**'
      - 'cartridges/**/ffi/**'
  pull_request:
    branches: [main]
    paths:
      - 'ffi/**'
      - 'cartridges/**/ffi/**'

permissions:
  contents: read

jobs:
  test:
    name: Zig FFI Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2

      - name: Run catalogue tests
        run: cd ffi/zig && zig build test --summary all

      - name: Run readiness tests
        run: cd ffi/zig && zig build readiness --summary all

      - name: Run cartridge FFI tests
        run: |
          for cart in database-mcp fleet-mcp nesy-mcp agent-mcp cloud-mcp container-mcp k8s-mcp git-mcp secrets-mcp queues-mcp iac-mcp observe-mcp ssg-mcp proof-mcp lsp-mcp dap-mcp bsp-mcp; do
            echo "Testing $cart..."
            cd cartridges/$cart/ffi && zig build test --summary all
            cd "$GITHUB_WORKSPACE"
          done

      - name: Build cartridge shared libraries
        run: |
          for cart in database-mcp fleet-mcp nesy-mcp agent-mcp cloud-mcp container-mcp k8s-mcp git-mcp secrets-mcp queues-mcp iac-mcp observe-mcp ssg-mcp proof-mcp lsp-mcp dap-mcp bsp-mcp; do
            echo "Building $cart .so..."
            cd cartridges/$cart/ffi && zig build
            cd "$GITHUB_WORKSPACE"
          done

      - name: Build static library
        run: cd ffi/zig && zig build lib

      - name: Run benchmarks
        run: cd ffi/zig && zig build bench

  v-lang-check:
    name: V-lang Adapter Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install V-lang
        run: |
          sudo apt-get update && sudo apt-get install -y libgc-dev
          git clone --depth=1 https://github.com/vlang/v
          cd v && make && sudo ./v symlink
          cd ..

      - name: Check LSP/DAP/BSP Adapters
        run: |
          for cart in lsp-mcp dap-mcp bsp-mcp; do
            echo "Checking $cart adapter..."
            v check cartridges/$cart/adapter/*.v
          done
