# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
# README single-source derivation (ADR-004): README.adoc is canonical;
# README.md is derived for the Glama MCP directory (Markdown-only renderer).
# Inlined from metadatastician/standards@1725bebd3773ea25627479f813283abf1c497a85
# while hyperpolymath's Actions allowlist omits metadatastician/standards@*.
name: README Derive

on:
  push:
    branches: [main, master]
    paths:
      - README.adoc
      - README.md
      - .machine_readable/**/ECOSYSTEM.a2ml
  pull_request:
    paths:
      - README.adoc
      - README.md
      - .machine_readable/**/ECOSYSTEM.a2ml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  readme-derive:
    name: Derive & verify README.md
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Read publishing declaration
        id: decl
        run: |
          set -euo pipefail
          ECO=""
          for c in .machine_readable/descriptiles/ECOSYSTEM.a2ml \
                   .machine_readable/6a2/ECOSYSTEM.a2ml; do
            if [ -f "$c" ]; then ECO="$c"; break; fi
          done
          if [ -z "$ECO" ]; then
            echo "No ECOSYSTEM.a2ml found — repo not opted in. Nothing to derive."
            echo "derive=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          eval "$(
            awk '
              /^[[:space:]]*\[/ { inblk = ($0 ~ /^[[:space:]]*\[publishing\.readme\][[:space:]]*$/) ? 1 : 0; next }
              inblk && /=/ {
                key = $0; sub(/=.*/, "", key); gsub(/[[:space:]]/, "", key)
                val = $0; sub(/^[^=]*=[[:space:]]*/, "", val)
                sub(/[[:space:]]*(#.*)?$/, "", val)
                gsub(/^"|"$/, "", val)
                if (key ~ /^(canonical|derive|format|path|consumer)$/)
                  printf "DECL_%s=%s\n", toupper(key), val
              }
            ' "$ECO"
          )"
          if [ "${DECL_DERIVE:-false}" != "true" ]; then
            echo "[publishing.readme] absent or derive != true — repo not opted in."
            echo "derive=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CANONICAL="${DECL_CANONICAL:-README.adoc}"
          DERIVED_PATH="${DECL_PATH:-README.md}"
          FORMAT="${DECL_FORMAT:-gfm}"
          CONSUMER="${DECL_CONSUMER:-unspecified}"
          if [ ! -f "$CANONICAL" ]; then
            echo "::error::Declared canonical '$CANONICAL' does not exist."
            exit 1
          fi
          if [ "$FORMAT" != "gfm" ]; then
            echo "::error::Unsupported derived format '$FORMAT' (only 'gfm' is implemented)."
            exit 1
          fi
          {
            echo "derive=true"
            echo "canonical=$CANONICAL"
            echo "derived_path=$DERIVED_PATH"
            echo "consumer=$CONSUMER"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout canonical vocab-gate script
        if: steps.decl.outputs.derive == 'true'
        uses: actions/checkout@v7.0.1
        with:
          repository: metadatastician/standards
          ref: 1725bebd3773ea25627479f813283abf1c497a85
          path: .standards-readme
          persist-credentials: false

      - name: Install toolchain
        if: steps.decl.outputs.derive == 'true'
        env:
          PANDOC_VERSION: "3.10"
          ASCIIDOCTOR_VERSION: "2.0.26"
          ASCIIDOCTOR_REDUCER_VERSION: "1.1.1"
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/pandoc.deb" \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/pandoc.deb"
          sudo gem install --no-document \
            "asciidoctor:${ASCIIDOCTOR_VERSION}" \
            "asciidoctor-reducer:${ASCIIDOCTOR_REDUCER_VERSION}"

      - name: Anchor-ID convention guard
        if: steps.decl.outputs.derive == 'true'
        env:
          CANONICAL: ${{ steps.decl.outputs.canonical }}
        run: |
          set -euo pipefail
          if grep -qE 'link:#[a-z0-9-]+\[' "$CANONICAL"; then
            if ! grep -qE '^:idprefix:[[:space:]]*$' "$CANONICAL" \
               || ! grep -qE '^:idseparator:[[:space:]]+-[[:space:]]*$' "$CANONICAL"; then
              echo "::error::$CANONICAL has intra-doc anchor links but omits ':idprefix:' or ':idseparator: -'."
              exit 1
            fi
          fi

      - name: Derive Markdown and verify vocabulary + freshness
        if: steps.decl.outputs.derive == 'true'
        env:
          CANONICAL: ${{ steps.decl.outputs.canonical }}
          DERIVED_PATH: ${{ steps.decl.outputs.derived_path }}
          THRESHOLD: "98"
        run: |
          set -euo pipefail
          asciidoctor-reducer "$CANONICAL" -o "$RUNNER_TEMP/reduced.adoc" \
            2>"$RUNNER_TEMP/reducer.err"
          if [ -s "$RUNNER_TEMP/reducer.err" ]; then
            cat "$RUNNER_TEMP/reducer.err" >&2
            exit 1
          fi
          asciidoctor --failure-level=WARN -b docbook5 -a attribute-missing=drop \
            "$RUNNER_TEMP/reduced.adoc" -o "$RUNNER_TEMP/reduced.xml"
          pandoc -f docbook -t gfm --wrap=preserve \
            "$RUNNER_TEMP/reduced.xml" -o "$RUNNER_TEMP/body.md"
          SPDX="$(grep -m1 -oE 'SPDX-License-Identifier:[[:space:]]*[^[:space:]]+' "$CANONICAL" || true)"
          {
            [ -n "$SPDX" ] && echo "<!-- $SPDX -->"
            echo "<!-- GENERATED from $CANONICAL by standards/.github/workflows/readme-derive-reusable.yml — do not edit. -->"
            echo ""
            cat "$RUNNER_TEMP/body.md"
          } > "$RUNNER_TEMP/derived.md"
          bash .standards-readme/.github/scripts/readme-vocab-gate.sh \
            "$CANONICAL" "$RUNNER_TEMP/derived.md" "$THRESHOLD"
          norm() { grep -vE '^<!-- (SPDX-License-Identifier|GENERATED)' "$1" \
                   | sed 's/[[:space:]]*$//' | cat -s; }
          if [ ! -f "$DERIVED_PATH" ] || ! diff -q <(norm "$RUNNER_TEMP/derived.md") <(norm "$DERIVED_PATH") >/dev/null; then
            echo "::error::'$DERIVED_PATH' is missing or stale relative to '$CANONICAL'. Regenerate via asciidoctor-reducer + asciidoctor + pandoc and commit."
            diff <(norm "$DERIVED_PATH") <(norm "$RUNNER_TEMP/derived.md") || true
            exit 1
          fi
          echo "✓ $DERIVED_PATH is up to date with $CANONICAL"
