# README single-source derivation (ADR-004): README.adoc is canonical;
# README.md is derived for the Glama MCP directory (Markdown-only renderer).
# This caller delegates to the standards reusable, which reads the
# [publishing.readme] declaration in .machine_readable/*/ECOSYSTEM.a2ml,
# regenerates README.md behind a vocabulary gate, and fails-and-tells if the
# committed README.md is stale relative to README.adoc.
name: README Derive

on:
  push:
    branches: [main, master]
    paths:
      - README.adoc
      - README.md
      - .machine_readable/**/ECOSYSTEM.a2ml
  pull_request:
    paths:
      - README.adoc
      - README.md
      - .machine_readable/**/ECOSYSTEM.a2ml

permissions:
  actions: read
  contents: read

jobs:
  readme-derive:
    # Pinned to a hyperpolymath/standards main commit that carries the gem
    # install fix (asciidoctor:VER syntax) and the anchor-ID convention guard
    # (standards#476); this repo's README.adoc satisfies both.
    uses: hyperpolymath/standards/.github/workflows/readme-derive-reusable.yml@5a0891e9e58b785181a92e141505ca96ca987b42
