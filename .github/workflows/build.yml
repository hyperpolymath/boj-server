#
# SonarQube Cloud (SonarCloud) static analysis. Generated from the SonarCloud
# setup wizard; analysis scope + exclusions live in sonar-project.properties.
# Requires the SONAR_TOKEN repository secret (Settings -> Secrets and variables
# -> Actions). Project: https://sonarcloud.io/project/overview?id=hyperpolymath_boj-server
name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  actions: read
  contents: read
jobs:
  sonarqube:
    name: SonarQube
    # Opt-in via repository variable SONAR_ENABLED=true (matching
    # boj-server-cartridges) so missing/unrotated SONAR_TOKEN does not produce
    # a permanent false-red check on PRs and main.
    if: vars.SONAR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
