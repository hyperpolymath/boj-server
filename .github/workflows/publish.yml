#
# Publish workflow — publishes to npm, the official MCP Server Registry, and JSR on version tag push (v*).
# Requires NPM_TOKEN and JSR_TOKEN repository secrets; MCP Registry uses GitHub OIDC (zero secrets).
name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: read

jobs:
  publish-npm:
    name: Publish to npm & MCP Registry
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify package and server.json versions match tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          MCP_NAME=$(node -p "require('./package.json').mcpName")
          SRV_VERSION=$(node -p "require('./server.json').version")
          SRV_NAME=$(node -p "require('./server.json').name")
          SRV_PKG_ID=$(node -p "require('./server.json').packages?.[0]?.identifier ?? ''")
          SRV_PKG_VERSION=$(node -p "require('./server.json').packages?.[0]?.version ?? ''")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$SRV_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match server.json version ($SRV_VERSION)"
            exit 1
          fi
          if [ "$MCP_NAME" != "$SRV_NAME" ]; then
            echo "::error::package.json mcpName ($MCP_NAME) does not match server.json name ($SRV_NAME)"
            exit 1
          fi
          if [ "$PKG_NAME" != "$SRV_PKG_ID" ]; then
            echo "::error::package.json name ($PKG_NAME) does not match server.json packages[0].identifier ($SRV_PKG_ID)"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$SRV_PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match server.json packages[0].version ($SRV_PKG_VERSION)"
            exit 1
          fi

      - name: Install mcp-publisher
        run: |
          ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          curl -fsSL -o /tmp/mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${OS}_${ARCH}.tar.gz"
          tar -xzf /tmp/mcp-publisher.tar.gz -C /tmp mcp-publisher
          chmod +x /tmp/mcp-publisher

      - name: Validate MCP manifest
        run: /tmp/mcp-publisher validate server.json

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Authenticate and publish to MCP Registry
        run: |
          /tmp/mcp-publisher login github-oidc
          /tmp/mcp-publisher publish

  publish-jsr:
    name: Publish to JSR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Setup Deno
        uses: denoland/setup-deno@v2.0.4
        with:
          deno-version: v2.x

      - name: Verify JSR config version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          JSR_VERSION=$(deno eval "const c = JSON.parse(Deno.readTextFileSync('jsr.json')); console.log(c.version)")
          if [ "$TAG_VERSION" != "$JSR_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match jsr.json version ($JSR_VERSION)"
            exit 1
          fi

      - name: Publish to JSR
        run: deno publish --config jsr.json
        env:
          JSR_TOKEN: ${{ secrets.JSR_TOKEN }}
