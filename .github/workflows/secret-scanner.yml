# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
# secret-scanner.yml — Canonical 3-pass secret scanner (gitleaks + rust-secrets + shell-secrets)
# synchronised with metadatastician/standards/.github/workflows/secret-scanner-reusable.yml
# at 1725bebd3773ea25627479f813283abf1c497a85 so the required status check
# `scan / gitleaks` (ruleset 24310441) executes directly while hyperpolymath's
# account-level Actions allowlist does not yet list metadatastician/standards@*.
name: Secret Scanner

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: scan / gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned + checksum-verified)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.18.4
          SHA256=ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d
          cd "$RUNNER_TEMP"
          curl -fsSL --proto '=https' --proto-redir '=https' --tlsv1.2 --retry 3 \
            -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          ./gitleaks version

      - name: Fetch estate gitleaks baseline
        if: hashFiles('.gitleaks.toml') == ''
        uses: actions/checkout@v7.0.1
        with:
          repository: metadatastician/standards
          ref: 1725bebd3773ea25627479f813283abf1c497a85
          path: .standards-gitleaks
          sparse-checkout: |
            config/gitleaks/estate-baseline.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Stage estate gitleaks baseline
        if: hashFiles('.gitleaks.toml') == ''
        run: |
          set -euo pipefail
          cp .standards-gitleaks/config/gitleaks/estate-baseline.toml .gitleaks-estate.toml
          rm -rf .standards-gitleaks
          test -s .gitleaks-estate.toml

      - name: Estate baseline — is it referenced?
        id: estate_baseline
        run: |
          set -euo pipefail
          if [ -f .gitleaks.toml ] && \
             grep -qE "^[[:space:]]*path[[:space:]]*=[[:space:]]*[\"']\.gitleaks-estate\.toml[\"']" .gitleaks.toml; then
            echo "referenced=true" >> "$GITHUB_OUTPUT"
          else
            echo "referenced=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Estate baseline — fetch
        if: steps.estate_baseline.outputs.referenced == 'true'
        uses: actions/checkout@v7.0.1
        with:
          repository: metadatastician/standards
          ref: 1725bebd3773ea25627479f813283abf1c497a85
          path: .estate-baseline-checkout
          sparse-checkout: config/gitleaks
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Estate baseline — install
        if: steps.estate_baseline.outputs.referenced == 'true'
        run: |
          set -euo pipefail
          src=.estate-baseline-checkout/config/gitleaks/estate-baseline.toml
          if [ ! -f "$src" ]; then
            echo "::error::Estate baseline missing at $src."
            exit 1
          fi
          cp "$src" .gitleaks-estate.toml
          rm -rf .estate-baseline-checkout

      - name: Gitleaks secret scan (gating)
        run: |
          set -euo pipefail
          CONFIG=".gitleaks-estate.toml"
          if [ -f .gitleaks.toml ]; then
            CONFIG=".gitleaks.toml"
          fi
          "$RUNNER_TEMP/gitleaks" detect \
            --source . \
            --no-git \
            --redact \
            --no-banner \
            --verbose \
            --config "$CONFIG" \
            --exit-code 1

      - name: Gitleaks secret scan — git history (gating)
        run: |
          set -euo pipefail
          if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
            echo "::error::checkout is shallow -- refusing vacuous history scan"
            exit 1
          fi
          CONFIG=".gitleaks-estate.toml"
          if [ -f .gitleaks.toml ]; then
            CONFIG=".gitleaks.toml"
          fi
          test -s "$CONFIG"
          "$RUNNER_TEMP/gitleaks" detect \
            --source . \
            --redact \
            --no-banner \
            --verbose \
            --config "$CONFIG" \
            --exit-code 1

      - name: Gitleaks secret scan — AsciiDoc mirror (gating)
        run: |
          set -euo pipefail
          MIRROR="$RUNNER_TEMP/adoc-mirror"
          REPORT="$RUNNER_TEMP/adoc-report.json"
          rm -rf "$MIRROR"
          mkdir -p "$MIRROR"
          found=0
          while IFS= read -r -d '' f; do
            dest="$MIRROR/$(dirname "$f")"
            mkdir -p "$dest"
            cp "$f" "$dest/$(basename "$f").txt"
            found=$((found + 1))
          done < <(find . -path ./.git -prune -o \( -name '*.adoc' -o -name '*.asciidoc' \) -type f -print0)
          if [ "$found" -eq 0 ]; then
            echo "No AsciiDoc files present — nothing to scan."
            exit 0
          fi
          config_args=(--config "$PWD/.gitleaks-estate.toml")
          if [ -f .gitleaks.toml ]; then
            config_args=(--config "$PWD/.gitleaks.toml")
          fi
          set +e
          "$RUNNER_TEMP/gitleaks" detect \
            --source "$MIRROR" \
            --no-git \
            --redact \
            --no-banner \
            --exit-code 1 \
            --report-format json \
            --report-path "$REPORT" \
            "${config_args[@]}"
          adoc_rc=$?
          set -e
          if [ "$adoc_rc" -ne 0 ] && [ "$adoc_rc" -ne 1 ]; then
            echo "::error::AsciiDoc gitleaks scan failed with exit code ${adoc_rc}."
            exit "$adoc_rc"
          fi
          if [ ! -f "$REPORT" ]; then
            echo "::error::AsciiDoc gitleaks scan did not write report ${REPORT}."
            exit 2
          fi
          count=0
          if [ -s "$REPORT" ]; then
            set +o pipefail
            count=$(grep -o '"RuleID"' "$REPORT" 2>/dev/null | wc -l | tr -d ' ')
            set -o pipefail
            [ -n "$count" ] || count=0
          fi
          if [ "$count" -eq 0 ]; then
            echo "No leaks found in AsciiDoc files."
            exit 0
          fi
          sed -n 's/.*"File": *"\([^"]*\)".*/\1/p' "$REPORT" \
            | sed -e "s|^${MIRROR}/||" -e 's|\.txt$||' \
            | sort -u \
            | sed 's/^/  - /'
          echo "::error::${count} secret(s) detected in AsciiDoc files."
          exit 1

  rust-secrets:
    name: scan / rust-secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check for hardcoded secrets in Rust
        run: |
          set -euo pipefail
          if ! find . -name Cargo.toml -not -path './target/*' -print -quit | grep -q .; then
            echo 'No Cargo.toml found — skipping Rust secrets check'
            exit 0
          fi
          mapfile -t FILES < <(find . -name '*.rs' \
            -not -path './target/*' -not -path '*/target/*' \
            -not -path './vendor/*' -not -path '*/vendor/*' \
            -not -path './.git/*' | sort)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo 'No .rs files found — skipping Rust secrets check'
            exit 0
          fi
          PATTERNS=(
            'const[[:space:]]+[A-Z0-9_]*SECRET[A-Z0-9_]*[[:space:]]*:[^=]*=[[:space:]]*b?"[^"]{8,}"'
            'const[[:space:]]+[A-Z0-9_]*PASSWORD[A-Z0-9_]*[[:space:]]*:[^=]*=[[:space:]]*b?"[^"]{8,}"'
            'const[[:space:]]+[A-Z0-9_]*API_KEY[A-Z0-9_]*[[:space:]]*:[^=]*=[[:space:]]*b?"[^"]{8,}"'
            'const[[:space:]]+[A-Z0-9_]*TOKEN[A-Z0-9_]*[[:space:]]*:[^=]*=[[:space:]]*b?"[^"]{8,}"'
            'HMAC.*"[a-fA-F0-9]{32,}"'
          )
          COMMENT='^[^:]*:[0-9][0-9]*:[[:space:]]*(//|/\*|\*)'
          ENV_RHS='=[^;]*(env::var|env::var_os|std::env|env!\(|option_env!\(|from_env|dotenv)'
          URL_RHS='=[[:space:]]*b?"(https?|wss?|ftp)://'
          PRAGMA='scanner-allow:[[:space:]]*rust-secrets'
          blocking=0
          for pattern in "${PATTERNS[@]}"; do
            hits="$(grep -nHE "$pattern" "${FILES[@]}" 2>/dev/null \
              | grep -vE "$COMMENT" \
              | grep -vE "$ENV_RHS" \
              | grep -vE "$URL_RHS" \
              | grep -vE "$PRAGMA" || [ $? -eq 1 ])"
            if [ -n "$hits" ]; then
              printf '%s\n' "$hits"
              blocking=1
            fi
          done
          if [ "$blocking" -eq 1 ]; then
            echo "::error::Potential hardcoded secrets detected in Rust sources."
            exit 1
          fi
          echo "No hardcoded secrets detected in Rust sources."

  shell-secrets:
    name: scan / shell-secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check for hardcoded secrets in shell scripts
        run: |
          set -euo pipefail
          PATTERNS=(
            '(export[[:space:]]+)?[A-Z_]*TOKEN[A-Z_]*=["'"'"'][A-Za-z0-9_./+=-]{20,}["'"'"']'
            '(export[[:space:]]+)?[A-Z_]*API_KEY[A-Z_]*=["'"'"'][A-Za-z0-9_./+=-]{20,}["'"'"']'
            '(export[[:space:]]+)?[A-Z_]*SECRET[A-Z_]*=["'"'"'][A-Za-z0-9_./+=-]{16,}["'"'"']'
            '(export[[:space:]]+)?PASSWORD=["'"'"'][^"'"'"']{6,}["'"'"']'
          )
          PRAGMA_RE='(scanner-allow:[[:space:]]*shell-secrets|hypatia:[[:space:]]*allow[[:space:]]+security_errors/secret_detected)'
          PARAM_EXPANSION_RE='=['"'"'"'"'"']?\$\{?[A-Za-z_][A-Za-z0-9_]*(:[?-][^}]*)?\}?['"'"'"'"'"']?[[:space:]]*(#.*)?$'
          found=0
          for pattern in "${PATTERNS[@]}"; do
            while IFS= read -r raw_match; do
              [[ -z "$raw_match" ]] && continue
              filepath="${raw_match%%:*}"
              rest="${raw_match#*:}"
              lineno="${rest%%:*}"
              content="${rest#*:}"
              if echo "$content" | grep -qE "$PARAM_EXPANSION_RE"; then continue; fi
              if echo "$content" | grep -qE '^[[:space:]]*#'; then continue; fi
              if echo "$content" | grep -qE "$PRAGMA_RE"; then continue; fi
              if [[ "$lineno" -gt 1 ]]; then
                prev_line=$(sed -n "$((lineno - 1))p" "$filepath" 2>/dev/null)
                if echo "$prev_line" | grep -qE "$PRAGMA_RE"; then continue; fi
              fi
              echo "::warning::$filepath:$lineno: $content"
              found=1
            done < <(grep -rnE --include='*.sh' --include='*.bash' \
                       --exclude-dir='.git' --exclude-dir='node_modules' --exclude-dir='target' \
                       "$pattern" . 2>/dev/null || [ $? -eq 1 ])
          done
          if [ "$found" -eq 1 ]; then
            echo "::error::Hardcoded secret detected in a shell script."
            exit 1
          fi
