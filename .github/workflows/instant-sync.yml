# Instant Forge Sync - Triggers propagation to all forges on push/release
name: Instant Sync

on:
  push:
    branches: [main, master]
  release:
    types: [published]

# Estate guardrail: cancel superseded runs so re-pushes / rebased PR
# updates do not pile up queued runs against the shared account-wide
# Actions concurrency pool. Applied only to read-only check workflows
# (no publish/mutation), so cancelling a superseded run is always safe.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check propagation token availability
        id: check-token
        env:
          FARM_TOKEN: ${{ secrets.FARM_DISPATCH_TOKEN }}
        run: |
          if [ -n "${FARM_TOKEN:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FARM_DISPATCH_TOKEN is not configured — skipping propagation dispatch."
          fi

      - name: Trigger Propagation
        if: steps.check-token.outputs.present == 'true' && secrets.FARM_DISPATCH_TOKEN != ''
        uses: peter-evans/repository-dispatch@v4.0.1
        with:
          token: ${{ secrets.FARM_DISPATCH_TOKEN }}
          repository: hyperpolymath/.git-private-farm
          event-type: propagate
          client-payload: |-
            {
              "repo": ${{ toJSON(github.event.repository.name) }},
              "ref": ${{ toJSON(github.ref) }},
              "sha": ${{ toJSON(github.sha) }},
              "forges": ""
            }

      - name: Confirm
        if: steps.check-token.outputs.present == 'true'
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: echo "::notice::Propagation triggered for ${REPO_NAME}"
