# This workflow is managed by gh actions-lock.
# Fallback Cloudflare Workers deploy via Direct Upload (wrangler deploy).
# Bypasses the Cloudflare Git Integration build system entirely.
# Uses wrangler deploy (Workers + Assets) rather than the deprecated
# `wrangler pages deploy` now that wrangler.toml uses [assets] syntax.
# Required secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check Cloudflare deploy credentials
        id: cf-creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${CF_TOKEN:-}" ] && [ -n "${CF_ACCOUNT:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not configured — skipping Cloudflare Workers deploy."
          fi
      - name: Cache Wrangler CLI binary
        if: steps.cf-creds.outputs.present == 'true'
        run: npx --yes wrangler@3.114.0 --version
      - name: Deploy site/ to Cloudflare Workers (static assets)
        if: steps.cf-creds.outputs.present == 'true' && secrets.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@3.114.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
