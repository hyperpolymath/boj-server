[package]
name = "cartridge-minter"
version = "0.1.0"
edition = "2024"
authors = ["Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>"]
description = "Wizard-driven cartridge scaffolder for BoJ Server — mints, provisions, configures, and harnesses cartridges"
license = "PMPL-1.0-or-later"
repository = "https://github.com/hyperpolymath/boj-server"

[[bin]]
name = "cartridge-minter"
path = "src/main.rs"

[[bin]]
name = "cm"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"
console = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = "0.4"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
criterion = "0.5"

[[bench]]
name = "scaffold_benchmark"
harness = false
